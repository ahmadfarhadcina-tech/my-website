<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cina Games</title>

  <style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
}

/* MENU */
.menu{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  background:#111;
}

.menu a{
  color:white;
  text-decoration:none;
  padding:8px 12px;
  background:#007bff;
  border-radius:8px;
}

/* AI BOX */
.ai-box{
  margin:20px auto;
  max-width:700px;
  background:#111;
  padding:15px;
  border-radius:15px;
  border-left:4px solid #00ff99;
}

.ai-box h3{
  color:#00ff99;
}

.ai-chat{
  text-align:center;
  margin:15px;
}

.ai-chat input{
  width:70%;
  max-width:500px;
  padding:10px;
  border-radius:8px;
  border:none;
}

.ai-chat button{
  padding:10px 15px;
  background:#00ff99;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-left:8px;
}
  </style>
</head>

<body>

<!-- MENU -->
<div class="menu">
  <a href="#">Home</a>
  <a href="games.html">Games</a>
  <a href="about.html">About</a>
</div>

<!-- AI CHAT INPUT -->
<div class="ai-chat">
  <input id="msg" type="text" placeholder="Ask Cina AI...">
  <button onclick="send()">Send</button>
</div>

<!-- AI RESPONSE BOX -->
<div class="ai-box">
  <h3>🤖 AI Response</h3>
  <p id="out">Waiting for your question...</p>
</div>

<script>
async function send(){

  let msg = document.getElementById("msg").value;

  if(!msg){
    document.getElementById("out").innerText = "Write something first!";
    return;
  }

  let res = await fetch("http://localhost:3000/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ message: msg })
  });

  let data = await res.json();

  document.getElementById("out").innerText =
    data.choices[0].message.content;
}
</script>

</body>
</html>
