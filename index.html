      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;

        background: rgba(17, 17, 17, 0.7);

        background: linear-gradient(90deg, #00ff99, #00cc77);
        color: black;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        margin-top: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 153, 0.4);
        transition: 0.2s;
      }
      .main-btn:hover { transform: scale(1.05); }

      .fixed-btn {
        position: fixed;
        bottom: 15px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
