<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد اختصاصی سینا گیمز</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: Tahoma; padding: 20px; }
        .dashboard { max-width: 800px; margin: auto; background: #111; padding: 30px; border-radius: 20px; border: 1px solid #40E0D0; }
        .section { margin-top: 30px; padding: 20px; background: #1a1a1a; border-radius: 15px; }
        .avatar-box { text-align: center; }
        img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #40E0D0; object-fit: cover; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 8px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="avatar-box">
        <img id="userImg" src="https://via.placeholder.com/120" alt="Avatar">
        <h2 id="uName">در حال دریافت...</h2>
        <input type="file" id="filePicker">
        <button onclick="uploadAvatar()">تغییر عکس</button>
    </div>

    <div class="section">
        <h3>تنظیمات حساب</h3>
        <input type="text" id="newName" placeholder="نام جدید">
        <button onclick="updateName()">ذخیره نام</button>
    </div>

    <div class="section">
        <h3>🎮 بازی‌های اخیر شما</h3>
        <ul id="gameList">
            <li>در حال بارگذاری لیست بازی‌ها...</li>
        </ul>
    </div>

    <button onclick="firebase.auth().signOut()">خروج از حساب</button>
</div>

<script>
    const firebaseConfig = { // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAQqPnniZ_QvzOi692uFAEB72TxDx2pDgI",
  authDomain: "cina-games.firebaseapp.com",
  projectId: "cina-games",
  storageBucket: "cina-games.firebasestorage.app",
  messagingSenderId: "449625451730",
  appId: "1:449625451730:web:153b2aec57e6c42ec2510b",
  measurementId: "G-YSQZ60ZNC8"
}; };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ۱. لود کردن اطلاعات
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).get().then(doc => {
                const data = doc.data();
                document.getElementById('uName').innerText = data.username;
                if(data.avatarUrl) document.getElementById('userImg').src = data.avatarUrl;
            });
        }
    });

    // ۲. ویرایش نام
    function updateName() {
        const newName = document.getElementById('newName').value;
        db.collection("users").doc(firebase.auth().currentUser.uid).update({ username: newName });
        document.getElementById('uName').innerText = newName;
    }

    // ۳. آپلود عکس
    function uploadAvatar() {
        const file = document.getElementById('filePicker').files[0];
        const ref = storage.ref('avatars/' + firebase.auth().currentUser.uid);
        ref.put(file).then(() => {
            ref.getDownloadURL().then(url => {
                db.collection("users").doc(firebase.auth().currentUser.uid).update({ avatarUrl: url });
                document.getElementById('userImg').src = url;
            });
        });
    }
</script>
</body>
</html>
