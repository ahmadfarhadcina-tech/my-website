<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل کاربری کامل | سینا گیمز</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: Tahoma; padding: 20px; }
        .dashboard { max-width: 600px; margin: auto; background: #111; padding: 30px; border-radius: 20px; border: 1px solid #40E0D0; }
        .avatar-box { text-align: center; }
        img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #40E0D0; object-fit: cover; }
        .section { margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 10px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; }
        button { background: #40E0D0; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="avatar-box">
        <img id="userImg" src="https://via.placeholder.com/120" alt="Avatar">
        <h2 id="uName">در حال بارگذاری...</h2>
        <input type="file" id="filePicker">
        <button onclick="uploadAvatar()">آپلود عکس جدید</button>
    </div>

    <div class="section">
        <h3>ویرایش پروفایل</h3>
        <input type="text" id="newName" placeholder="نام جدید">
        <button onclick="updateName()">ذخیره نام</button>
    </div>

    <div class="section">
        <h3>🎮 بازی‌های اخیر</h3>
        <ul id="gameList"><li>هنوز بازی انجام نداده‌اید.</li></ul>
    </div>

    <button onclick="firebase.auth().signOut().then(() => window.location.href='index.html')" style="background:#ff4444; color:white;">خروج از حساب</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQqPnniZ_QvzOi692uFAEB72TxDx2pDgI",
        authDomain: "cina-games.firebaseapp.com",
        projectId: "cina-games",
        storageBucket: "cina-games.firebasestorage.app",
        messagingSenderId: "449625451730",
        appId: "1:449625451730:web:153b2aec57e6c42ec2510b",
        measurementId: "G-YSQZ60ZNC8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            // دریافت اطلاعات کاربر
            db.collection("users").doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('uName').innerText = data.username;
                    if(data.avatarUrl) document.getElementById('userImg').src = data.avatarUrl;
                }
            });
            // دریافت بازی‌ها (فرض می‌کنیم در دیتابیس کلکشن games دارید)
            db.collection("games").where("uid", "==", user.uid).get().then(snapshot => {
                const list = document.getElementById('gameList');
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    list.innerHTML += `<li>${doc.data().name}</li>`;
                });
            });
        } else {
            window.location.href = "index.html";
        }
    });

    function updateName() {
        const newName = document.getElementById('newName').value;
        if(!newName) return;
        db.collection("users").doc(firebase.auth().currentUser.uid).update({ username: newName });
        document.getElementById('uName').innerText = newName;
        alert("نام تغییر کرد!");
    }

    function uploadAvatar() {
        const file = document.getElementById('filePicker').files[0];
        if(!file) return alert("فایل انتخاب کن!");
        const ref = storage.ref('avatars/' + firebase.auth().currentUser.uid);
        ref.put(file).then(() => {
            ref.getDownloadURL().then(url => {
                db.collection("users").doc(firebase.auth().currentUser.uid).update({ avatarUrl: url });
                document.getElementById('userImg').src = url;
                alert("عکس آپلود شد!");
            });
        });
    }
</script>
</body>
</html>
