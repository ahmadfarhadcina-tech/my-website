<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل کاربری سینا گیمز</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        /* استایل‌ها */
        body { background: #050505; color: #fff; font-family: Tahoma; padding: 20px; }
        .dashboard { max-width: 900px; margin: auto; background: #111; padding: 40px; border-radius: 25px; border: 1px solid #40E0D0; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #40E0D0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; }
        button { background: #40E0D0; cursor: pointer; font-weight: bold; }
        #progressContainer { width: 100%; height: 8px; background: #333; margin: 10px 0; display: none; }
        #progressBar { height: 100%; width: 0%; background: #00ff55; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="profile-header">
        <img id="userImg" src="https://via.placeholder.com/100" class="avatar-img">
        <div>
            <h2 id="uName">در حال بارگذاری...</h2>
            <p id="uEmail" style="color: #888;">...</p>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div style="background: #1a1a1a; padding: 20px; border-radius: 15px;">
            <h3>تنظیمات</h3>
            <input type="file" id="filePicker">
            <div id="progressContainer"><div id="progressBar"></div></div>
            <button onclick="uploadAvatar()">آپلود عکس</button>
            <input type="text" id="newName" placeholder="نام جدید">
            <button onclick="updateName()">تغییر نام</button>
        </div>
        <div style="background: #1a1a1a; padding: 20px; border-radius: 15px;">
            <h3>بازی‌های اخیر</h3>
            <ul id="gameList"><li>در حال لود شدن...</li></ul>
        </div>
    </div>
    <button onclick="firebase.auth().signOut().then(() => window.location.href='index.html')" style="background:#ff4444; color:white; margin-top:20px;">خروج</button>
</div>

<script>
    // کانفیگ تو
    const firebaseConfig = {
        apiKey: "AIzaSyAQqPnniZ_QvzOi692uFAEB72TxDx2pDgI",
        authDomain: "cina-games.firebaseapp.com",
        projectId: "cina-games",
        storageBucket: "cina-games.firebasestorage.app",
        messagingSenderId: "449625451730",
        appId: "1:449625451730:web:153b2aec57e6c42ec2510b",
        measurementId: "G-YSQZ60ZNC8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // اجرای خودکار هنگام ورود
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            document.getElementById('uEmail').innerText = user.email || "بدون ایمیل";
            db.collection("users").doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('uName').innerText = data.username || "بدون نام";
                    if(data.avatarUrl) document.getElementById('userImg').src = data.avatarUrl;
                }
            });
            // لود بازی‌ها
            db.collection("games").where("uid", "==", user.uid).get().then(snapshot => {
                const list = document.getElementById('gameList');
                list.innerHTML = "";
                snapshot.forEach(doc => list.innerHTML += `<li>${doc.data().name}</li>`);
            });
        } else { window.location.href = "index.html"; }
    });

    // توابع کنترلی
    function updateName() {
        const name = document.getElementById('newName').value;
        if(!name) return alert("نام را بنویس");
        db.collection("users").doc(firebase.auth().currentUser.uid).update({ username: name })
            .then(() => { document.getElementById('uName').innerText = name; alert("نام عوض شد!"); });
    }

    function uploadAvatar() {
        const file = document.getElementById('filePicker').files[0];
        if(!file) return alert("عکس انتخاب کن");
        const bar = document.getElementById('progressBar');
        document.getElementById('progressContainer').style.display = "block";
        const task = storage.ref('avatars/' + firebase.auth().currentUser.uid).put(file);
        task.on('state_changed', 
            (s) => bar.style.width = (s.bytesTransferred/s.totalBytes)*100 + "%",
            (e) => alert("خطا: " + e.message),
            () => task.snapshot.ref.getDownloadURL().then(url => {
                db.collection("users").doc(firebase.auth().currentUser.uid).update({ avatarUrl: url });
                document.getElementById('userImg').src = url;
                alert("آپلود شد!");
                document.getElementById('progressContainer').style.display = "none";
            })
        );
    }
</script>
</body>
</html>
