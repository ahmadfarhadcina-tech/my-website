<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل کاربری سینا گیمز</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { background: #050505; color: #fff; font-family: Tahoma; padding: 20px; }
        .dashboard { max-width: 900px; margin: auto; background: #111; padding: 40px; border-radius: 25px; border: 1px solid #40E0D0; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #40E0D0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; }
        button { background: #40E0D0; cursor: pointer; font-weight: bold; }
        #progressContainer { width: 100%; height: 8px; background: #333; margin: 10px 0; display: none; }
        #progressBar { height: 100%; width: 0%; background: #00ff55; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="profile-header">
        <img id="userImg" src="https://via.placeholder.com/100" class="avatar-img">
        <div>
            <h2 id="uName">در حال بارگذاری...</h2>
            <p id="uEmail" style="color: #888;">...</p>
        </div>
    </div>

   <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div style="background: #1a1a1a; padding: 20px; border-radius: 15px;">
        <h3>تنظیمات</h3>
        <input type="text" id="newName" placeholder="نام جدید" style="width: 100%; padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px;">
        <button onclick="updateName()" style="width: 100%; padding: 10px; background: #40E0D0; border: none; border-radius: 5px; cursor: pointer;">تغییر نام</button>
        
        <h3 style="margin-top: 20px;">انتخاب استیکر گیمینگ</h3>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;">
            <img src="https://img.icons8.com/color/96/controller.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/joystick.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/gaming-headset.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/sword.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/treasure-chest.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/dragon.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/fire-element.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/lightning-bolt.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/knight-helmet.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/shield.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/trophy.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/skull.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/ninja-head.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/space-shuttle.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
            <img src="https://img.icons8.com/color/96/alien.png" onclick="saveSticker(this.src)" style="cursor:pointer; width:40px;">
        </div>
    </div>
    
  <div style="background: #1a1a1a; padding: 20px; border-radius: 15px; margin-bottom: 20px;">
    <h3>بیوگرافی من</h3>
    <textarea id="userBio" placeholder="درباره خودت بنویس..." style="width: 100%; height: 60px; padding: 10px; border-radius: 5px; border: none; background: #222; color: #fff;"></textarea>
    <button onclick="saveBio()" style="margin-top: 10px; background: #40E0D0; color: #000; font-weight: bold;">ذخیره بیو</button>
</div>

       
       <div style="background: #1a1a1a; padding: 20px; border-radius: 15px;">
        <h3>بازی‌های اخیر</h3>
        <ul id="gameList" style="list-style: none; padding: 0;"><li>در حال لود شدن...</li></ul>
    </div>
</div>
 

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQqPnniZ_QvzOi692uFAEB72TxDx2pDgI",
        authDomain: "cina-games.firebaseapp.com",
        projectId: "cina-games",
        storageBucket: "cina-games.firebasestorage.app",
        messagingSenderId: "449625451730",
        appId: "1:449625451730:web:153b2aec57e6c42ec2510b",
        measurementId: "G-YSQZ60ZNC8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            document.getElementById('uEmail').innerText = user.email || "بدون ایمیل";
            db.collection("users").doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('uName').innerText = data.username || "بدون نام";
                    if(data.avatarUrl) document.getElementById('userImg').src = data.avatarUrl;
                } else {
                    document.getElementById('uName').innerText = "کاربر جدید";
                }
            });
            db.collection("games").where("uid", "==", user.uid).get().then(snapshot => {
                const list = document.getElementById('gameList');
                list.innerHTML = "";
                snapshot.forEach(doc => list.innerHTML += `<li>${doc.data().name}</li>`);
            });
        } else { window.location.href = "index.html"; }
    });

   function saveBio() {
    const bioText = document.getElementById('userBio').value;
    const uid = firebase.auth().currentUser.uid;
    
    db.collection("users").doc(uid).set({ 
        bio: bioText 
    }, { merge: true })
    .then(() => {
        alert("بیوگرافی با موفقیت ذخیره شد!");
    })
    .catch((error) => {
        alert("خطا: " + error.message);
    });
}

    
    function updateName() {
        const name = document.getElementById('newName').value;
        if(!name) return alert("نام را بنویس");
        const uid = firebase.auth().currentUser.uid;
        db.collection("users").doc(uid).set({ username: name }, { merge: true })
            .then(() => { document.getElementById('uName').innerText = name; alert("نام با موفقیت ذخیره شد!"); });
    }

  function saveSticker(stickerUrl) {
    const user = firebase.auth().currentUser;
    if (user) {
        db.collection("users").doc(user.uid).set({ avatarUrl: stickerUrl }, { merge: true })
        .then(() => {
            alert("استیکر با موفقیت ذخیره شد!");
            location.reload();
        })
        .catch((error) => {
            alert("خطا: " + error.message);
        });
    } else {
        alert("لطفا ابتدا وارد شوید");
    }
}
 
</script>
</body>
</html>
