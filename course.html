<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cina Games | فروشگاه و صفحه اصلی</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
body { margin: 0; background: #0f0f0f; color: white; font-family: Arial, sans-serif; padding-bottom: 90px; text-align: center; }
.gothic-cina-games { font-family: 'Old English Text MT', 'Georgia', serif; font-weight: bold; color: #ffffff !important; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, 0 0 15px #40E0D0; }
.header-store { padding: 20px; background: rgba(17, 17, 17, 0.9); border-bottom: 1px solid rgba(64, 224, 208, 0.2); }
.store-title { font-size: 28px; margin: 0 0 10px 0; }

/* بخش نمایش بازی‌ها */
.games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; padding: 20px; max-width: 600px; margin: auto; }
.game-card { background: #1a1a2e; border: 1px solid #333; border-radius: 15px; padding: 12px; text-decoration: none; color: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.game-card:hover { transform: translateY(-3px); border-color: #00ff66; box-shadow: 0 0 15px rgba(0,255,102,0.3); }
.game-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; }
.game-card h4 { margin: 8px 0 4px 0; font-size: 14px; }
.game-card span { font-size: 11px; color: #00ff66; }

/* 📱 نوار ناوبری پایینی هماهنگ */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: rgba(15, 15, 20, 0.96); backdrop-filter: blur(12px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(64, 224, 208, 0.25); z-index: 9999; }
.nav-item { color: #aaa; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; font-weight: bold; transition: 0.2s; }
.nav-item.active, .nav-item:hover { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.3); }
.nav-icon { font-size: 22px; margin-bottom: 3px; }
</style>
</head>
<body>

<div class="header-store">
  <h1 class="gothic-cina-games store-title">Cina Games Store</h1>
  <p style="color: #ccc; margin: 0; font-size: 14px;">به ویترین بازی‌های اندروید و PC خوش آمدید</p>
</div>

<!-- جایگاه بازی‌ها (بخش گیم) -->
<h3 style="text-align: right; max-width: 600px; margin: 25px auto 10px auto; padding: 0 20px; color: #40E0D0;">🔥 برترین بازی‌های پیشنهادی</h3>

<div class="games-grid">
  <!-- بازی اول -->
  <a href="#" class="game-card">
    <img src="wwe2k15.jpg" onerror="this.src='icon.png'">
    <h4>WWE 2K15 Winlator</h4>
    <span>فشرده اندروید</span>
  </a>
  
  <!-- بازی دوم -->
  <a href="#" class="game-card">
    <img src="gta.jpg" onerror="this.src='icon.png'">
    <h4>GTA V Winlator</h4>
    <span>۱۴ گیگابایت</span>
  </a>

  <!-- بازی سوم -->
  <a href="#" class="game-card">
    <img src="aethersx2.jpg" onerror="this.src='icon.png'">
    <h4>AetherSX2 Emulator</h4>
    <span>۳۰ مگابایت</span>
  </a>
</div>

<!-- 📱 نوار ناوبری پایینی -->
<nav class="bottom-nav">
  <a href="course.html" class="nav-item active">
    <span class="nav-icon">🏠</span>
    <span>خانه (فروشگاه)</span>
  </a>
  <a href="course.html" class="nav-item">
    <span class="nav-icon">🎮</span>
    <span>گیم‌ها</span>
  </a>
  <a href="index.html" class="nav-item">
    <span class="nav-icon">📊</span>
    <span>داشبورد (امکانات)</span>
  </a>
</nav>

</body>
</html>
