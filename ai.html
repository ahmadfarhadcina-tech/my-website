<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cina AI Chat</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.header{
  text-align:center;
  padding:15px;
  background:#111;
  color:#00ff99;
  font-size:20px;
}

.chat-box{
  max-width:600px;
  margin:auto;
  padding:15px;
  height:70vh;
  overflow:auto;
}

.msg{
  padding:8px;
  margin:8px 0;
  background:#222;
  border-radius:8px;
}

.ai{
  color:#00ff99;
}

.input-box{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
}

input{
  width:70%;
  padding:10px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  background:#00ff99;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">🤖 Cina AI Chat</div>

<div id="chat" class="chat-box"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message...">
  <button onclick="send()">Send</button>
</div>

<script>
function getAnswer(msg){

  msg = msg.toLowerCase();

  // ===== GREET =====
  if(msg.includes("سلام") || msg.includes("hi") || msg.includes("hello"))
    return "سلام 👋 خوش آمدی به Cina AI 🤖";

  // ===== NAME SYSTEM =====
  if(msg.includes("من امید هستم"))
    return "چطوری جسور جان 😎 چی کمکی می‌توانم برایت انجام بدهم؟";

  if(msg.includes("من رشاد هستم"))
    return "بفرما کاپیتان جهانگیر 👑⚽ خوش آمدی 😎";

  if(msg.includes("من نجات هستم"))
    return "بفرمایید شاهین جان 🦅 چطوری می‌توانم کمک کنم؟";

  if(msg.includes("من عابدین هستم") || msg.includes("من عاب الدین هستم"))
    return "بفرما مبارز جان ⚔️ چه کاری از دستم ساخته است؟";

  if(msg.includes("من فرهاد هستم"))
    return "سلام سینا جان 👤 سازنده عزیز 🤖 خوش آمدی";

  if(msg.includes("من امرالدین هستم"))
    return "بفرما شریفی جان 😎 خوش آمدی به Cina AI";

  if(msg.includes("من جواد هستم"))
    return "بفرما آریان جان 👋 خوش آمدی 😎";

  if(msg.includes("من مجیب هستم"))
    return"به کیرم که کی هستی لاشی اونجا برم میکنمت";

  // ===== WEBSITE =====
  if(msg.includes("این سایت برای چیست"))
    return "این سایت Cina Games 🎮 برای معرفی و دانلود بازی‌ها ساخته شده است";

  if(msg.includes("بخاطر چی ساخته شده"))
    return "برای سرگرمی و معرفی بازی‌ها ساخته شده 🎮";

  // ===== GAMES =====
  if(msg.includes("gta v"))
    return "🎮 GTA V یک بازی جهان باز خیلی معروف است";

  if(msg.includes("gta iv"))
    return "🎮 GTA IV نسخه قدیمی GTA است";

  if(msg.includes("wwe 2k15"))
    return "🎮 WWE 2K15 بازی کشتی کج است";

  if(msg.includes("wwe 2k25"))
    return "🎮 WWE 2K25 نسخه جدید کشتی کج است";

  if(msg.includes("watch dogs"))
    return "🎮 Watch Dogs بازی هک و اکشن است";

  if(msg.includes("bully"))
    return "🎮 Bully بازی مدرسه‌ای از Rockstar است";

  if(msg.includes("god of war"))
    return "🎮 God of War بازی اکشن افسانه‌ای است";

  // ===== COUNTRY =====
  if(msg.includes("افغانستان"))
    return "🇦🇫 افغانستان کشور زیبایی است";

  if(msg.includes("جوزجان"))
    return "جوزجان یکی از ولایت‌های افغانستان است";

  // ===== TEAM =====
  if(msg.includes("تیم عقابان"))
    return "تیم عقابان ⚽ در قریه حیدرآباد جوزجان است و کاپیتان آن جهانگیر 👑 می‌باشد";

  // ===== DEFAULT =====
  return "ببخشید 🙏 من در حال یادگیری هستم، لطفاً سوال دیگری بپرس";
}

function send(){
  let msg = document.getElementById("msg").value;
  if(!msg) return;

  let chat = document.getElementById("chat");

  chat.innerHTML += "<div class='msg'><b>You:</b> " + msg + "</div>";

  let reply = getAnswer(msg);

  setTimeout(()=>{
    chat.innerHTML += "<div class='msg ai'><b>AI:</b> " + reply + "</div>";
    chat.scrollTop = chat.scrollHeight;
  }, 500);

  document.getElementById("msg").value = "";
}
</script>

</body>
</html>
