<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cina AI Chat</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.header{
  text-align:center;
  padding:15px;
  background:#111;
  color:#00ff99;
  font-size:20px;
}

.chat-box{
  max-width:600px;
  margin:auto;
  padding:15px;
  height:70vh;
  overflow:auto;
}

.msg{
  padding:8px;
  margin:8px 0;
  background:#222;
  border-radius:8px;
}

.ai{
  color:#00ff99;
}

.input-box{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
}

input{
  width:70%;
  padding:10px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  background:#00ff99;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">🤖 Cina AI Chat</div>

<div id="chat" class="chat-box"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message...">
  <button onclick="send()">Send</button>
</div>

<script>
function getAnswer(msg){

  if(msg.includes("سلام")) return "سلام 👋 خوش آمدی به Cina AI";
  if(msg.includes("اسم تو چیست")) return "اسم من Cina AI 🤖 است";
  if(msg.includes("سازنده تو کیست")) return "سازنده من Cina (احمد فرهاد سینا) است 👤";
  if(msg.includes("این لینک برای چیست")) return "این لینک برای ورود به بخش‌های سایت Cina Games ساخته شده است 🔗";

  if(msg.includes("wwe 2k15")) return "🎮 WWE 2K15 یک بازی کشتی کج با گرافیک خوب است";
  if(msg.includes("gtav")) return "🎮 GTA V یک بازی جهان باز بسیار معروف است";
  if(msg.includes("gta iv")) return "🎮 GTA IV نسخه قدیمی GTA است";
  if(msg.includes("wwe 2k25")) return "🎮 WWE 2K25 نسخه جدید کشتی کج است";
  if(msg.includes("watch dogs")) return "🎮 Watch Dogs بازی هک کردن است";
  if(msg.includes("bully")) return "🎮 Bully بازی مدرسه‌ای است";
  if(msg.includes("god of war 2")) return "🎮 God of War 2 بازی اکشن است";

  if(msg.includes("معرفی همه بازی های تو سایت")) return "🎮 سایت شامل GTA، WWE، God of War و Watch Dogs است";
  if(msg.includes("این لینک مربوط کیست")) return "این لینک مربوط به Cina Games و پروژه‌های سینا است 🔗";
  if(msg.includes("بخاطر چی درست شده")) return "این سایت برای معرفی و دانلود بازی‌ها ساخته شده است 🎮";
  if(msg.includes("احمد فرهاد سینا از کجا است")) return "احمد فرهاد سینا از افغانستان 🇦🇫 است";

  if(msg.includes("تیم عقابان")) 
    return "تیم عقابان یک تیم فوتبال است در قریه حیدرآباد جوزجان است و کاپیتان آن جهانگیر است و سازنده این سایت یکی از بازیکنان عقابان فرهاد سینا میباشد";

  // 💥 این قسمت مهمه 👇
  return "ببخشید 🙏 من در حال یادگیری هستم، لطفاً سوال دیگری بپرس";
}
</body>
</html>
