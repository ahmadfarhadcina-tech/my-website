<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاوره با گرگی جان | Cina Games</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .ai-container {
            background: linear-gradient(145deg, #111827, #1f2937);
            border: 2px solid #10b981;
            border-radius: 20px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
            box-sizing: border-box;
        }
        .avatar-box {
            font-size: 60px;
            margin-bottom: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        h2 {
            color: #10b981;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
            letter-spacing: 1px;
        }
        p.welcome-text {
            color: #a7f3d0;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        /* باکس چت مستقیم اختصاصی گرگی جان */
        .gorgi-chat-box {
            background-color: #0d1321;
            border: 1px solid #1f2937;
            border-radius: 15px;
            height: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            text-align: right;
        }
        .gorgi-chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .gorgi-msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        /* پیام‌های کاربر - سمت چپ، خط انگلیسی با رنگ خاکستری تیره */
        .gorgi-msg.user {
            background-color: #2d3748;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            text-align: left;
            direction: ltr;
        }
        /* پیام‌های بات (گرگی جان) - سمت راست با رنگ فیروزه‌ای سنگین */
        .gorgi-msg.bot {
            background-color: #065f46;
            color: #e6fffa;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            text-align: right;
            direction: rtl;
            border: 1px solid #047857;
        }
        .gorgi-chat-input-area {
            padding: 10px;
            background-color: #111827;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1f2937;
        }
        .gorgi-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: #ffffff;
            font-size: 0.9rem;
        }
        .gorgi-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.4);
        }
        .gorgi-send-btn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }
        .gorgi-send-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="ai-container">
        <div class="avatar-box">🐺</div>
        <h2>اتاق مشاوره با گرگی جان</h2>
        <p class="welcome-text">هوش مصنوعی و راهنمای گیم اختصاصی استور <b>Cina Games</b></p>
        
        <!-- باکس چت مستقیم که درون کانتینر شما ست شده است -->
        <div class="gorgi-chat-box">
            <div class="gorgi-chat-messages" id="gorgi-chat-messages">
                <div class="gorgi-msg bot">سلام رفیق! صفا آوردی به استور کاکا فرهاد. من گرگی جان هستم. هر سوالی در مورد دانلود گیم‌ها، نسخه‌های مود شده یا تنظیمات شبیه‌سازها داری بپرس تا سریع کلک‌اش را بکنیم! 🔥</div>
            </div>
            <div class="gorgi-chat-input-area">
                <input type="text" id="gorgi-user-input" class="gorgi-input" placeholder="سؤالت را بپرس ستون...">
                <button id="gorgi-send-btn" class="gorgi-send-btn">ارسال</button>
            </div>
        </div>
    </div>

    <script>
        // اتصال مستقیم کلید معتبر و جدید کاکا فرهاد
        const GEMINI_API_KEY = "AQ.Ab8RN6IqX2BQNkiW_Saq1FVqNqrpkeqYkV-u6BDqqTOmRg54zg"; 
        
        // آموزش هویت به هوش مصنوعی برای درک کامل استور سینا گیمز و کاکا فرهاد
        const SYSTEM_INSTRUCTION = "تو گرگی جان، هوش مصنوعی و راهنمای گیم اختصاصی استور Cina Games (به مدیریت کاکا فرهاد در کابل، افغانستان) هستی. کاربران بازی‌های اندروید، PC و شبیه‌سازها را دانلود می‌کنند. لحن تو باید کاملاً رفیقانه، لوتی، صمیمی، خفن و گیمری باشد. همیشه طوری صحبت کن که انگار یک رفیق صمیمی گیمر هستی.";

        const sendBtn = document.getElementById('gorgi-send-btn');
        const userInput = document.getElementById('gorgi-user-input');
        const chatMessages = document.getElementById('gorgi-chat-messages');

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // نمایش پیام کاربر در سمت چپ صفحه (مخصوص متون گیمری و انگلیسی)
            appendMessage(text, 'user');
            userInput.value = '';

            // نمایش وضعیت در حال تایپ گرگی جان
            const typingId = appendMessage('در حال نوشتن... 🐺', 'bot-typing');

            try {
                // ارسال درخواست به سرور جدید گوگل با متد ایمن و استاندارد
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                    })
                });
                
                const data = await response.json();
                const typingElement = document.getElementById(typingId);
                if(typingElement) typingElement.remove();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot');
                } else {
                    appendMessage('کاکا فرهاد، دیتای دریافتی تغییر کرده؛ لطفاً کنسول مرورگر را بررسی کن رفیق!', 'bot');
                }
            } catch (error) {
                const typingElement = document.getElementById(typingId);
                if(typingElement) typingElement.remove();
                appendMessage('مشکلی در اتصال پیش آمد رفیق، دوباره امتحان کن!', 'bot');
                console.error(error);
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            msgDiv.id = id;
            msgDiv.className = 'gorgi-msg ' + (sender === 'bot-typing' ? 'bot' : sender);
            msgDiv.innerText = text;

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
