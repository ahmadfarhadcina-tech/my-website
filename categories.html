<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Cina Games Storeitle>
  <meta name="description" content="Browse games by category - Action, Open World, Sports, Lite, Emulator">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/store.css">
  <style>
    .category-hero {
      padding: 80px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    }
    
    .category-hero h1 {
      font-size: 36px;
      margin-bottom: 16px;
    }
    
    .category-hero p {
      color: var(--text-secondary);
      font-size: 16px;
    }
    
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    @media (min-width: 768px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    .category-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 16 / 10;
      text-decoration: none;
      display: flex;
      align-items: flex-end;
      padding: 24px;
      transition: var(--transition);
    }
    
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
    }
    
    .category-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: var(--transition);
    }
    
    .category-card:hover .category-card-bg {
      transform: scale(1.05);
    }
    
    .category-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
    }
    
    .category-card-content {
      position: relative;
      z-index: 2;
    }
    
    .category-card h3 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: white;
    }
    
    .category-card p {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .category-action { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .category-openworld { background: linear-gradient(135deg, #00ff66, #009933); }
    .category-sports { background: linear-gradient(135deg, #0088ff, #0044cc); }
    .category-lite { background: linear-gradient(135deg, #ffcc00, #cc9900); }
    .category-emulator { background: linear-gradient(135deg, #aa00ff, #6600cc); }
    .category-online { background: linear-gradient(135deg, #00ccff, #0088aa); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="store-navbar">
    <div class="store-navbar-inner">
      <a href="index.html" class="store-logo">
        <span style="color: #00ff66;">Cina</span> Games
      </a>
      
      <div class="store-search">
        <input type="text" placeholder="Search games..." id="searchInput">
      </div>
      
      <button class="store-mobile-menu-btn">☰</button>
      
      <div class="store-nav-links">
        <a href="index.html">Home</a>
        <a href="games.html">All Games</a>
        <a href="categories.html" class="active">Categories</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </nav>

  <!-- Category Hero -->
  <div class="category-hero">
    <h1>Browse by Category</h1>
    <p>Find your perfect game from our curated categories</p>
  </div>

  <!-- Category Grid -->
  <div class="category-grid">
    
    <a href="games.html?cat=action" class="category-card">
      <div class="category-card-bg category-action"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>⚔️ Action</h3>
        <p>Intense combat and adventure games</p>
      </div>
    </a>
    
    <a href="games.html?cat=openworld" class="category-card">
      <div class="category-card-bg category-openworld"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>🌍 Open World</h3>
        <p>Explore vast open worlds</p>
      </div>
    </a>
    
    <a href="games.html?cat=sports" class="category-card">
      <div class="category-card-bg category-sports"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>🏆 Sports</h3>
        <p>Wrestling, football, and more</p>
      </div>
    </a>
    
    <a href="games.html?cat=lite" class="category-card">
      <div class="category-card-bg category-lite"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>📱 Lite Games</h3>
        <p>Lightweight games for weak phones</p>
      </div>
    </a>
    
    <a href="games.html?cat=emulator" class="category-card">
      <div class="category-card-bg category-emulator"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>🎮 Emulators</h3>
        <p>Play console games on mobile</p>
      </div>
    </a>
    
    <a href="games.html?cat=online" class="category-card">
      <div class="category-card-bg category-online"></div>
      <div class="category-card-overlay"></div>
      <div class="category-card-content">
        <h3>🌐 Online</h3>
        <p>Multiplayer and online games</p>
      </div>
    </a>
  </div>

  <!-- Footer -->
  <footer class="store-footer">
    <div class="store-footer-inner">
      <div class="store-footer-col">
        <h4>Cina Games</h4>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      
      <div class="store-footer-col">
        <h4>Categories</h4>
        <a href="games.html?cat=action">Action</a>
        <a href="games.html?cat=openworld">Open World</a>
      </div>
      
      <div class="store-footer-col">
        <h4>Support</h4>
        <a href="#">Help</a>
        <a href="#">FAQ</a>
      </div>
      
      <div class="store-footer-col">
        <h4>Legal</h4>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
      </div>
    </div>
    
    <div class="store-footer-bottom">
      <p>© 2026 Cina Games. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/store.js"></script>
</body>
</html>
